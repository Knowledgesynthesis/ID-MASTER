name: Verify learning site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
      - name: Smoke-test the existing Vercel production site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_BASE_URL: https://id-master-two.vercel.app
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 8 "$SMOKE_BASE_URL/febrile-infant" | grep -q 'Evidence-linked infectious disease learning'; then
              node scripts/smoke.mjs
              exit $?
            fi
            sleep 10
          done
          echo 'Production did not serve the new application route in the verification window.'
          exit 1
