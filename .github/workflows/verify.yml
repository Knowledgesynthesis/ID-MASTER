name: Verify learning site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Report production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/id-master-smoke" --no-save --package-lock=false playwright@1.58.2
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/id-master-smoke/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          if command -v google-chrome; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/id-master-smoke/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - run: node scripts/smoke.mjs
      - name: Smoke-test the existing Vercel production site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_BASE_URL: https://id-master-two.vercel.app
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 8 "$SMOKE_BASE_URL/febrile-infant" | grep -q 'Evidence-linked infectious disease learning'; then
              node scripts/smoke.mjs
              exit $?
            fi
            sleep 10
          done
          echo 'Production did not serve the new application route in the verification window.'
          exit 1
